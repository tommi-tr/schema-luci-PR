html,body{margin:0;background:#e6e6e6;font-family:"Courier New",Courier,monospace;color:#000}

.it.on .tb{display:flex}
.tb button{width:24px;height:24px;padding:0;border:1px solid #000;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tb button:hover{background:#000}
.tb button:hover svg{stroke:#fff}
.tb svg{stroke:#000;fill:none;stroke-width:2}

.tag.long .t1{font-size:8px;line-height:10px}
.t1{font-size:10px;line-height:13px;font-weight:700;letter-spacing:.06em}
.t2{font-size:17px;line-height:20px;font-weight:700}
.truss{position:absolute;left:122px;width:940px;height:8px;border-top:2px solid #000;border-bottom:2px solid #000;background:#fff}
@media print{

<script>

var DEF={faro:{top:'',mid:'?',bot:''},led:{top:'PAR',mid:'',bot:'?·?·?'},big:{top:'PAR GRANDE',mid:'',bot:'?·?·?·?'},cob:{top:'COB',mid:'',bot:'?·?·?'},bar:{top:'',mid:'BARRA LED',bot:'?'}};

state.sym=state.sym||'a';

// migrazione dai salvataggi precedenti
state.items.forEach(function(i){
  if(i.label!==undefined){
    if(i.t==='faro'){i.top=i.label;i.mid=i.ch;i.bot='';}
    else if(i.t==='bar'){i.top='';i.mid=i.label;i.bot=i.ch;}

    delete i.label; delete i.ch;
  }

});

function rowOf(it){ if(!it.row) return null; for(var i=0;i<state.rows.length;i++) if(state.rows[i].id===it.row) return state.rows[i]; return null; }
function snapRow(y){ var best=null,bd=SNAP; state.rows.forEach(function(r){ var d=Math.abs(r.y-y); if(d<bd){bd=d;best=r;} }); return best; }
function yOff(t,h){ return t==='faro'?34:h/2; }
function clampX(x,w){ return Math.round(Math.min(1055-w/2,Math.max(135+w/2,x))); }
function clampY(y){ return Math.round(Math.max(60,Math.min(740,y))); }
function clampRow(y){ return Math.round(Math.max(70,Math.min(720,y))); }
function scale(){ return sheet.getBoundingClientRect().width/1123 || 1; }
function el(cls,css,txt){ var e=document.createElement('div'); if(cls) e.className=cls; if(css) e.style.cssText=css; if(txt!=null) e.textContent=txt; return e; }
function persist(){ $('#state').textContent=JSON.stringify(state).replace(/</g,'\\u003c'); }
var fut=[];
function pushHist(s){ hist.push(s); if(hist.length>150) hist.shift(); fut=[]; }
function snap(){ pushHist(JSON.stringify(state)); }
function undo(){ if(!hist.length) return; fut.push(JSON.stringify(state)); state=JSON.parse(hist.pop()); persist(); render(); refreshRows(); }
function redo(){ if(!fut.length) return; hist.push(JSON.stringify(state)); state=JSON.parse(fut.pop()); persist(); render(); refreshRows(); }

function hot(r){ sheet.querySelectorAll('.truss').forEach(function(t){ t.classList.toggle('hot', !!r && state.rows[+t.dataset.i]===r); }); }

function reposition(){
  sheet.querySelectorAll('.truss').forEach(function(t){ var r=state.rows[+t.dataset.i]; t.style.top=(r.y-4)+'px'; });
  sheet.querySelectorAll('.tag').forEach(function(t){ var r=state.rows[+t.dataset.i]; t.style.top=r.y+'px'; });
  sheet.querySelectorAll('.it').forEach(function(e){ var it=e._it; if(it) e.style.top=(it.y-yOff(it.t,e._h))+'px'; });
}

function bindEdit(e,get,set,o){
  o=o||{};
  function finish(){
    if(!o.always){ e.contentEditable='false'; e.classList.remove('editing'); }
    var v=e.innerText.replace(/ /g,' ');
    if(o.multi) v=v.replace(/\n+$/,''); else v=v.replace(/\s*\n\s*/g,' ').trim();
    if(v!==get()){ snap(); set(v); persist(); if(o.after) o.after(); }
    e.textContent=v;
  }
  function begin(){
    if(e.isContentEditable) return;
    e.contentEditable='true'; e.classList.add('editing'); e.focus();
    var r=document.createRange(); r.selectNodeContents(e); var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  e._begin=begin;
  e.addEventListener('blur',function(){ if(e.isContentEditable) finish(); });

    ev.stopPropagation();
    if(ev.key==='Escape'){ e.textContent=get(); e.blur(); }

    ev.preventDefault();
    var t=(ev.clipboardData||window.clipboardData).getData('text');

   '<circle cx="'+(w*.34).toFixed(1)+'" cy="'+y1.toFixed(1)+'" r="'+r+'" fill="#000"/><circle cx="'+(w*.66).toFixed(1)+'" cy="'+y1.toFixed(1)+'" r="'+r+'" fill="#000"/><circle cx="'+(w/2)+'" cy="'+y2.toFixed(1)+'" r="'+r+'" fill="#000"/>';

  return '<svg class="sym" width="'+(w*sc)+'" height="'+(h*sc)+'" viewBox="0 0 '+w+' '+h+'"'+(rot?' style="transform:rotate('+rot+'deg)"':'')+'>'+b+'</svg>';
}
function mini(t,mode,sc){ return symSVG(t,0,sc||.5,mode).replace('class="sym"','class="msym"'); }

function buildItem(it){
  var w=T[it.t][0],h=T[it.t][1];

    if(svg) svg.style.transform='rotate('+it.rot+'deg)';
    rotPos(mid,it.rot); persist();
  }
  e._rotate=function(d){ snap(); rotate(d); };
  if(it.t==='faro'){
    tb.appendChild(mkBtn('Ruota di 30° a sinistra',ICON_RL,function(){ snap(); rotate(-30); }));
    tb.appendChild(mkBtn('Ruota di 30° a destra',ICON_RR,function(){ snap(); rotate(30); }));
  }
  tb.appendChild(mkBtn('Duplica',ICON_DUP,function(){
    snap(); var n=JSON.parse(JSON.stringify(it)); n.id=state.nextId++;
    var nx=clampX(it.x+w+10,w); if(nx-it.x<w) nx=clampX(it.x-w-10,w); n.x=nx;
    state.items.splice(state.items.indexOf(it)+1,0,n); persist(); render();
  }));
  tb.appendChild(mkBtn('Elimina',ICON_DEL,function(){
    snap(); state.items.splice(state.items.indexOf(it),1); persist(); render();
  }));
  e.appendChild(tb);
  function placeTb(){ tb.style.bottom='calc(100% + '+(lbEl.offsetHeight+8)+'px)'; }
  var tm=null;
  e.addEventListener('mouseenter',function(){ hov=e; clearTimeout(tm); placeTb(); e.classList.add('on'); });
  lbEl.addEventListener('input',placeTb);
  e.addEventListener('mouseleave',function(){ if(hov===e) hov=null; clearTimeout(tm); tm=setTimeout(function(){ e.classList.remove('on'); },300); });

  // trascinamento libero, con magnete verso le americane
  var st=null;
  function mv(ev){
    if(!st) return;
    var s=scale(), dx=(ev.clientX-st.x)/s, dy=(ev.clientY-st.y)/s;
    if(!st.moved){ if(Math.abs(dx)<4&&Math.abs(dy)<4) return; st.moved=true; e.classList.add('drag'); }
    it.x=clampX(st.ix+dx,w); it.y=clampY(st.iy+dy);
    e.style.left=(it.x-w/2)+'px'; e.style.top=(it.y-yOff(it.t,h))+'px';
    hot(snapRow(it.y));
  }
  function up(){
    window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
    if(st&&st.moved){
      pushHist(st.pre);
      var t=snapRow(it.y);
      if(t){ it.row=t.id; it.y=t.y; } else { it.row=null; }
      st=null; persist(); render(); return;
    }
    e.classList.remove('drag'); hot(null);
    var fl=st&&st.field; st=null;
    if(fl&&fl._begin&&e.contains(fl)) fl._begin();
  }
  e.addEventListener('pointerdown',function(ev){
    if(ev.button!==0||ev.target.isContentEditable) return;
    st={x:ev.clientX,y:ev.clientY,ix:it.x,iy:it.y,pre:JSON.stringify(state),moved:false,field:ev.target.closest&&ev.target.closest('.f')};
    window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
  });

  return e;
}

// trascinamento di un'americana in verticale: porta con sé i fari agganciati
function attachRowDrag(tg,i){
  var r=state.rows[i], st=null;
  function mv(ev){
    if(!st) return;
    var dy=(ev.clientY-st.y)/scale();
    if(!st.moved){ if(Math.abs(dy)<3) return; st.moved=true; }
    r.y=clampRow(st.y0+dy);
    state.items.forEach(function(it){ if(it.row===r.id) it.y=r.y; });
    reposition();
  }
  function up(){
    window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up);
    if(st&&st.moved){ pushHist(st.pre); persist(); }
    st=null;
  }
  tg.addEventListener('pointerdown',function(ev){
    if(ev.button!==0||ev.target.isContentEditable) return;
    st={y:ev.clientY,y0:r.y,pre:JSON.stringify(state),moved:false};
    window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
  });
}

function refreshRows(){
  var sel=$('#selRow'), v=sel.value; sel.innerHTML='';
  state.rows.forEach(function(r){ var t1=(r.t1||'').trim(), t2=(r.t2||'').trim(), o=document.createElement('option'); o.value=r.id;
    o.dataset.full=(t1+' '+t2).trim()||r.id; o.dataset.short=((t1.length>4?t1.slice(0,2)+'.':t1)+' '+t2).trim()||r.id; o.textContent=o.dataset.short; sel.appendChild(o); });
  if(v) sel.value=v;
}
function rowLabels(full){ Array.prototype.forEach.call($('#selRow').options,function(o){ o.textContent=full?o.dataset.full:o.dataset.short; }); }

function render(){
  sheet.innerHTML='';
  hov=null;
  sheet.appendChild(el('abs','left:128px;top:98px;width:922px;height:465px;border:1.5px dashed #000'));
  var title=el('abs f','left:40px;top:22px;width:700px;height:26px;font-size:17px;line-height:26px;',state.title);
  title.setAttribute('data-ph','Titolo'); bindEdit(title,function(){return state.title;},function(v){state.title=v;},{always:true});
  sheet.appendChild(title);
  var hr=el('abs f','left:743px;top:22px;width:340px;height:26px;font-size:12px;line-height:26px;text-align:right',state.headR);
  hr.setAttribute('data-ph','intestazione'); bindEdit(hr,function(){return state.headR;},function(v){state.headR=v;},{always:true});
  sheet.appendChild(hr);
  state.rows.forEach(function(r,i){ var t=el('truss',''); t.dataset.i=i; t.addEventListener('dblclick',function(){ distribute(state.rows[i]); }); sheet.appendChild(t); });
  state.rows.forEach(function(r,i){
    var tg=el('tag'+((r.t1||'').length>12?' long':''),''); tg.dataset.i=i; tg.title="Trascina per spostare l'americana";
    var a=el('f t1',null,r.t1); a.setAttribute('data-ph','nome'); bindEdit(a,function(){return r.t1;},function(v){r.t1=v;},{after:refreshRows});
    var b=el('f t2',null,r.t2); b.setAttribute('data-ph','n.'); bindEdit(b,function(){return r.t2;},function(v){r.t2=v;},{after:refreshRows});
    tg.appendChild(a); tg.appendChild(b); sheet.appendChild(tg);
    attachRowDrag(tg,i);
  });
  state.items.forEach(function(it){ sheet.appendChild(buildItem(it)); });
  var fl=el('abs f multi','left:40px;top:738px;width:520px;height:58px;font-size:12px;line-height:16px;',state.footL);
  fl.setAttribute('data-ph','note a piè di pagina (sinistra)'); bindEdit(fl,function(){return state.footL;},function(v){state.footL=v;},{always:true,multi:true});
  var fr=el('abs f multi','left:563px;top:738px;width:520px;height:58px;font-size:12px;line-height:16px;text-align:right',state.footR);
  fr.setAttribute('data-ph','note a piè di pagina (destra)'); bindEdit(fr,function(){return state.footR;},function(v){state.footR=v;},{always:true,multi:true});
  sheet.appendChild(fl); sheet.appendChild(fr);
  reposition();
  $('#symSwitch').setAttribute('aria-checked',state.sym==='b'?'true':'false');
}

function distribute(r){
  var its=state.items.filter(function(i){return i.row===r.id;});
  if(!its.length) return;
  its.sort(function(a,b){return a.x-b.x;});
  var W=0; its.forEach(function(i){W+=T[i.t][0];});
  var gap=Math.max(2,(920-W)/(its.length+1));
  snap(); var x=135+gap;
  its.forEach(function(i){ var w=T[i.t][0]; i.x=Math.round(x+w/2); x+=w+gap; });
  persist(); render();
}

var zc=100;
function setZoom(p){
  zc=Math.max(30,Math.min(160,p));
  var s=zc/100;
  $('#wrap').style.transform='scale('+s+')';
  var h=$('#holder'); h.style.width=(1123*s)+'px'; h.style.height=(794*s)+'px';
  $('#zoom').value=Math.round(zc); $('#zv').textContent=Math.round(zc)+'%';
}
function fitPct(){
  var availW=document.documentElement.clientWidth-34, availH=window.innerHeight-$('#bar').offsetHeight-34;
  return Math.min(availW/1123,availH/794)*100;
}
function fit(){ setZoom(fitPct()); }

function serialize(){
  persist();
  var c=document.documentElement.cloneNode(true);
  c.querySelector('#sheet').innerHTML='';
  c.querySelector('#selRow').innerHTML='';
  c.querySelector('#wrap').removeAttribute('style');
  c.querySelector('#holder').removeAttribute('style');
  return '<!doctype html>\n'+c.outerHTML;
}
async function saveAs(){
  var html=serialize(), blob=new Blob([html],{type:'text/html'}), name='schema-luci.html';
  if(window.showSaveFilePicker){
    try{
      var h=await window.showSaveFilePicker({suggestedName:name,types:[{description:'Pagina HTML',accept:{'text/html':['.html']}}]});
      var w=await h.createWritable(); await w.write(blob); await w.close(); return;
    }catch(err){ if(err&&err.name==='AbortError') return; }
  }
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
}

  return ''+
  '<p>La pagina funziona senza internet. Non salva nulla finché non salvi tu con i pulsanti in alto.</p>'+

  row('PC 1000','faro')+row('PAR','led')+row('PAR grande','big')+row('COB','cob')+
  '<tr><td>Barra LED</td><td class="c">'+barMini()+'</td><td class="c">'+barMini()+'</td></tr></table>'+
  '<h3>2 · Vista</h3>'+
  '<p>Per cambiare lo zoom puoi:</p><ul>'+

  '<p>Per avere un faro uguale a uno esistente, passaci sopra e premi <b>Duplica</b>.</p>'+
  '<p>Per eliminare un faro, passaci sopra con il mouse e premi <b>Elimina</b>. I canali degli altri fari non cambiano.</p>'+
  '<h3>4 · Posizionare un faro</h3><ul>'+
  '<li><b>Trascinalo</b> lungo l\'americana o su un\'altra.</li>'+
  '<li>Lascialo <b>libero</b> fuori dalle americane. Vicino a un\'americana si aggancia (effetto magnete).</li>'+
  '<li><b>Doppio clic in uno spazio vuoto</b> di un\'americana: distribuisce i fari in modo simmetrico, a distanze uguali.</li></ul>'+

  '<li><b>Salva con nome…</b> crea una copia della pagina con tutte le modifiche. Riaprendola ritrovi la stessa combinazione.</li>'+
  '<li><b>Stampa / PDF</b>: A4 orizzontale, senza pulsanti.</li></ul>'+
  '<p>Titolo, intestazione e note a piè di pagina, se non sono inserite, non vengono stampate né salvate nel PDF.</p>';
}
function openHelp(){ $('#helpBody').innerHTML=helpHTML(); $('#ver').textContent='Versione script '+VERSION; $('#help').hidden=false; }
function closeHelp(){ $('#help').hidden=true; }
refreshRows(); persist();
$('#symA').innerHTML=mini('faro','a',.45)+mini('led','a',.45);
$('#symB').innerHTML=mini('faro','b',.45)+mini('led','b',.45);
$('#symSwitch').addEventListener('click',function(){ snap(); state.sym=state.sym==='b'?'a':'b'; persist(); render(); });
$('#bHelp').addEventListener('click',openHelp);
$('#hClose').addEventListener('click',closeHelp);
$('#help').addEventListener('pointerdown',function(e){ if(e.target===this) closeHelp(); });
$('#bSave').addEventListener('click',saveAs);
$('#bPrint').addEventListener('click',function(){ window.print(); });
$('#bUndo').addEventListener('click',undo);
$('#bRedo').addEventListener('click',redo);
['mousedown','focus','keydown'].forEach(function(e){ $('#selRow').addEventListener(e,function(){ rowLabels(true); }); });
['change','blur'].forEach(function(e){ $('#selRow').addEventListener(e,function(){ rowLabels(false); }); });
$('#bReset').addEventListener('click',function(){ if(!initial||JSON.stringify(state)===initial) return; snap(); state=JSON.parse(initial); persist(); render(); refreshRows(); });
$('#bFit').addEventListener('click',function(){ userZoom=null; fit(); });
$('#zoom').addEventListener('input',function(){ userZoom=+this.value; setZoom(userZoom); });
// zoom con pizzico a due dita del touchpad e gesti Safari
window.addEventListener('wheel',function(ev){
  if(!ev.ctrlKey) return;
  ev.preventDefault(); ev.stopPropagation();
  userZoom=zc*Math.exp(-Math.max(-25,Math.min(25,ev.deltaY))*0.01); setZoom(userZoom);
},{passive:false,capture:true});
var gz=100;
window.addEventListener('gesturestart',function(e){ e.preventDefault(); gz=zc; });
window.addEventListener('gesturechange',function(e){ e.preventDefault(); userZoom=gz*e.scale; setZoom(userZoom); });
$('#bAdd').addEventListener('click',function(){
  var t=$('#selType').value, rid=$('#selRow').value, d=DEF[t];
  var r=state.rows.filter(function(x){return x.id===rid;})[0]||state.rows[0];
  snap(); state.items.push({id:state.nextId++,row:r.id,y:r.y,t:t,x:600,rot:(t==='faro'&&r.id==='rs')?180:0,top:d.top,mid:d.mid,bot:d.bot});
  persist(); render();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#help').hidden){ closeHelp(); return; }
  if(e.target.isContentEditable) return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); }
});
window.addEventListener('resize',function(){ if(userZoom===null) fit(); });
initial=JSON.stringify(state);
render(); fit();
})();
</script>
